[lint]
respect-ignore = true
output-format = "concise"
quiet = false

# Rules not supported by mado: MD040 (code fence language), MD060 (table columns)
rules = [
  "MD001",
  "MD002",
  "MD003",
  "MD004",
  "MD005",
  "MD006",
  "MD007",
  "MD009",
  "MD010",
  "MD012",
  "MD013",
  "MD014",
  "MD018",
  "MD019",
  "MD020",
  "MD021",
  "MD022",
  "MD023",
  # MD024 disabled for Keep a Changelog format (repeated section headings)
  "MD025",
  "MD026",
  "MD027",
  "MD028",
  "MD029",
  "MD030",
  "MD031",
  "MD032",
  "MD033",
  "MD034",
  "MD035",
  "MD036",
  "MD037",
  "MD038",
  "MD039",
  # MD040 not supported by mado (code fence language checking)
  "MD041",
  "MD046",
  "MD047",
]

[lint.md002]
level = 1

[lint.md003]
style = "atx"

[lint.md004]
style = "dash"

[lint.md007]
indent = 2

[lint.md013]
line-length = 100
code-blocks = false
tables = false

[lint.md029]
style = "ordered"

[lint.md033]
allowed-elements = [
  "a",
  "br",
  "details",
  "div",
  "figcaption",
  "figure",
  "hostname",
  "img",
  "picture",
  "source",
  "strong",
  "sub",
  "summary",
  "sup",
]

[lint.md035]
style = "consistent"

[lint.md046]
style = "fenced"
